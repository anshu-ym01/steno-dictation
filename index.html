
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Steno Dictation Practice</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #1e293b;
        }

        .card {
            background: white;
            padding: 25px;
            margin-top: 20px;
            border-radius: 12px;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 10px;
            font-size: 17px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        input[type="range"] {
            width: 70%;
        }

        audio {
            width: 100%;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🎧 Steno Dictation Practice</h1>

        <div class="card">

            <h2>Text to Speech</h2>

            <textarea id="textInput"
                placeholder="Write your dictation text here..."></textarea>

            <p>
                Speed:
                <strong id="speedLabel">100</strong> WPM
            </p>

            <input
                type="range"
                id="speedRange"
                min="50"
                max="200"
                value="100"
            >

            <br><br>

            <button onclick="speakText()">▶ Play</button>

            <button onclick="pauseSpeech()">⏸ Pause</button>

            <button onclick="resumeSpeech()">▶ Resume</button>

            <button onclick="stopSpeech()">⏹ Stop</button>

        </div>


        <div class="card">

            <h2>Upload MP3 Dictation</h2>

            <input
                type="file"
                id="audioFile"
                accept="audio/*"
            >

            <audio id="audioPlayer" controls></audio>

        </div>

    </div>


    <script>

        const textInput = document.getElementById("textInput");

        const speedRange = document.getElementById("speedRange");

        const speedLabel = document.getElementById("speedLabel");

        const audioFile = document.getElementById("audioFile");

        const audioPlayer = document.getElementById("audioPlayer");


        // Speed label update

        speedRange.addEventListener("input", function () {

            speedLabel.textContent = speedRange.value;

        });


        // Text to Speech

        function speakText() {

            const text = textInput.value.trim();

            if (text === "") {

                alert("Please enter some text first.");

                return;

            }

            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);

            const wpm = Number(speedRange.value);

            utterance.rate = wpm / 150;

            utterance.pitch = 1;

            utterance.volume = 1;

            window.speechSynthesis.speak(utterance);

        }


        // Pause

        function pauseSpeech() {

            window.speechSynthesis.pause();

        }


        // Resume

        function resumeSpeech() {

            window.speechSynthesis.resume();

        }


        // Stop

        function stopSpeech() {

            window.speechSynthesis.cancel();

        }


        // MP3 upload and play

        audioFile.addEventListener("change", function () {

            const file = audioFile.files[0];

            if (!file) return;

            const audioURL = URL.createObjectURL(file);

            audioPlayer.src = audioURL;

            audioPlayer.play();

        });

    </script>

</body>
</html>
